services:
  postgres:
    build: .
    container_name: synagogue_db
    environment:
      POSTGRES_DB:       ${DB_NAME:-synagogues}
      POSTGRES_USER:     ${DB_USER:-research}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Schema is applied automatically on first start
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      # Named volume keeps data when the container is removed
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-research} -d ${DB_NAME:-synagogues}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    # To export data before moving to another server:
    #   docker run --rm -v cc_web_scraping_postgres_data:/data \
    #     -v $(pwd):/backup alpine \
    #     tar czf /backup/postgres_data.tar.gz -C /data .
    #
    # To restore on the new server:
    #   docker run --rm -v cc_web_scraping_postgres_data:/data \
    #     -v $(pwd):/backup alpine \
    #     tar xzf /backup/postgres_data.tar.gz -C /data
